name: ebook_reader_demo
description: "BookHub - Ứng dụng đọc sách E-book (Flutter + REST API + SQL Server) - Nhóm 10"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Quản lý trạng thái theo mô hình MVVM (ChangeNotifierProvider, Consumer...).
  provider: ^6.1.2
  # Gọi REST API của máy chủ BookHub (Node.js/Express).
  dio: ^5.11.1
  # Lưu JWT an toàn trên thiết bị.
  flutter_secure_storage: ^11.2.0
  # CSDL SQLite trên máy: sách đã tải, tiến độ đọc chờ đồng bộ.
  sqflite: ^2.4.4+2
  # Thư mục lưu file PDF đã tải về.
  path_provider: ^2.1.6
  # Hiển thị ảnh bìa từ máy chủ, có lưu đệm.
  cached_network_image: ^4.0.4
  # Chọn file PDF khi đăng sách.
  file_picker: ^13.1.0
  # Chọn ảnh bìa từ thư viện ảnh / camera của điện thoại.
  image_picker: ^1.2.4
  # Trình đọc PDF (Android, iOS, web) và đọc số trang của file PDF.
  syncfusion_flutter_pdfviewer: ^35.1.41
  syncfusion_flutter_pdf: ^35.1.41
  syncfusion_flutter_core: ^35.1.41

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Ảnh tải từ bên ngoài: bỏ vào assets/images/ rồi dùng Image.asset('assets/images/ten_anh.png').
  assets:
    - assets/images/
